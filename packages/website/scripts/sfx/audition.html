<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint sound audition</title>
<style>
  :root { --paper:#f1e7d0; --ink:#1d2433; --muted:#5d6475; --rule:#cdbf9f; --signal:#b4452f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 Georgia, 'Times New Roman', serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 36px 0 10px; font-weight: 600; }
  p { margin: 0 0 12px; color: var(--muted); }
  button { font: inherit; background: var(--ink); color: var(--paper); border: 0; border-radius: 4px; padding: 8px 14px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal); color: #fff; }
  button:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .row .meta { flex: 1; }
  .row .name { font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
  .row .role { font-size: 14px; color: var(--muted); }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  label { font-size: 14px; color: var(--muted); display:flex; gap:8px; align-items:center; }
  #log { font: 13px/1.6 ui-monospace, Menlo, monospace; color: var(--muted); min-height: 3.2em; }
</style>
</head>
<body>
<main>
  <h1>Waypoint sound audition</h1>
  <p>Synthesised in code, no samples. Press <strong>Play the journey</strong> for the opening on the engine's real timing, or audition each sound below.</p>

  <div class="bar">
    <label>Master <input id="master" type="range" min="0" max="1" step="0.01" value="0.7"></label>
    <label>Ambience <input id="bed" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  </div>

  <h2>Journey</h2>
  <div class="bar">
    <button id="journey">Play the journey</button>
    <button id="stop" class="ghost">Stop</button>
    <label><input id="music" type="checkbox" checked> With the jig</label>
  </div>
  <p id="log" role="status" aria-live="polite"></p>

  <h2>Sounds</h2>
  <div id="list"></div>
</main>
<script>
const BASE = '../../public/sfx/';
const context = new (window.AudioContext || window.webkitAudioContext)();
const master = context.createGain();
const bedGain = context.createGain();
master.connect(context.destination);
bedGain.connect(master);
const buffers = {};
const live = new Set();
let manifest = [];
let bedSource = null;

const log = (text) => { document.getElementById('log').textContent = text; };
document.getElementById('master').oninput = (e) => { master.gain.value = Number(e.target.value); };
document.getElementById('bed').oninput = (e) => { bedGain.gain.value = Number(e.target.value) * 0.5; };
master.gain.value = 0.7;
bedGain.gain.value = 0.25;

async function load() {
  manifest = await (await fetch(BASE + 'manifest.json')).json();
  await Promise.all(manifest.map(async (item) => {
    const bytes = await (await fetch(BASE + item.file)).arrayBuffer();
    buffers[item.file] = await context.decodeAudioData(bytes);
  }));
  const list = document.getElementById('list');
  manifest.forEach((item) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="meta"><div class="name">${item.file}</div><div class="role">${item.role} (${item.seconds}s${item.loop ? ', loop' : ''}, ${(item.bytes / 1024).toFixed(0)} KB)</div></div>`;
    const button = document.createElement('button');
    button.textContent = item.loop ? 'Loop' : 'Play';
    if (item.loop) {
      button.setAttribute('aria-pressed', 'false');
      let source = null;
      button.onclick = async () => {
        await context.resume();
        if (source) { source.stop(); source = null; button.setAttribute('aria-pressed', 'false'); return; }
        source = context.createBufferSource();
        source.buffer = buffers[item.file];
        source.loop = true;
        const g = context.createGain();
        g.gain.value = 0.5;
        source.connect(g).connect(master);
        source.start();
        button.setAttribute('aria-pressed', 'true');
      };
    } else {
      button.onclick = async () => { await context.resume(); shot(item.file, 0, 0.8); };
    }
    row.appendChild(button);
    list.appendChild(row);
  });
}

function shot(file, when, gain = 1, rate = 1) {
  const source = context.createBufferSource();
  const g = context.createGain();
  source.buffer = buffers[file];
  source.playbackRate.value = rate;
  g.gain.value = gain;
  source.connect(g).connect(master);
  source.start(context.currentTime + when);
  live.add(source);
  source.onended = () => live.delete(source);
  return source;
}

function stopAll() {
  live.forEach((s) => { try { s.stop(); } catch {} });
  live.clear();
  if (bedSource) { bedSource.stop(); bedSource = null; }
  bedGain.gain.cancelScheduledValues(context.currentTime);
}

function penLeg(start, seconds, speedPeak) {
  const source = context.createBufferSource();
  const g = context.createGain();
  source.buffer = buffers['pen-draw-loop.mp3'];
  source.loop = true;
  source.connect(g).connect(master);
  const t0 = context.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  const steps = 40;
  for (let i = 0; i <= steps; i += 1) {
    const f = i / steps;
    const velocity = Math.sin(Math.PI * f) ** 0.8;
    g.gain.linearRampToValueAtTime(velocity * speedPeak, t0 + f * seconds);
  }
  g.gain.linearRampToValueAtTime(0, t0 + seconds + 0.05);
  source.start(t0);
  source.stop(t0 + seconds + 0.1);
  live.add(source);
}

document.getElementById('stop').onclick = () => { stopAll(); log('Stopped.'); };

document.getElementById('journey').onclick = async () => {
  await context.resume();
  stopAll();
  const now = context.currentTime;
  const bedLevel = Number(document.getElementById('bed').value) * 0.5;

  bedSource = context.createBufferSource();
  bedSource.buffer = buffers['harbour-ambience.mp3'];
  bedSource.loop = true;
  bedSource.connect(bedGain);
  if (document.getElementById('music').checked) {
    const music = context.createBufferSource();
    const musicGain = context.createGain();
    music.buffer = buffers['shanty-loop.mp3'];
    music.loop = true;
    musicGain.gain.setValueAtTime(0, now);
    musicGain.gain.linearRampToValueAtTime(0.22, now + 3);
    music.connect(musicGain).connect(master);
    music.start(now + 2.8);
    live.add(music);
  }
  bedGain.gain.setValueAtTime(0, now);
  bedGain.gain.linearRampToValueAtTime(bedLevel, now + 2.5);
  bedSource.start();

  // Engine timings: drop starts 0.3s, impact 1.3s, intro ends 2.8s.
  shot('ink-drip.mp3', 0.3, 0.7);
  shot('ink-blob.mp3', 1.3, 0.85);
  shot('paper-rustle.mp3', 2.8, 0.6);
  log('0.3s drop lets go, 1.3s blob and bleed, 2.8s first card.');

  // First leg: pen draws for ~4.2s, lands on checkpoint, card turns in.
  penLeg(4.4, 4.2, 0.55);
  shot('checkpoint-arrive.mp3', 8.6, 0.85);
  shot('paper-rustle.mp3', 8.7, 0.6);
  penLeg(11.5, 4.8, 0.55);
  shot('checkpoint-arrive.mp3', 16.3, 0.85);
  shot('paper-rustle.mp3', 16.4, 0.6);
  penLeg(19, 5.6, 0.6);
  shot('route-complete.mp3', 24.6, 0.9);
  setTimeout(() => log('Route complete. The bed keeps looping; press Stop to end.'), 24600);
};

load().catch((error) => log('Could not load sounds: ' + error.message + '. Serve this page over HTTP from packages/website.'));
</script>
</body>
</html>
