<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logbook Waypoint</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: 'Public Sans', system-ui, sans-serif;
      font-size: 13px;
      color: #211d19;
      background: #e9e1d3;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header img { width: 32px; height: 32px; border-radius: 9px; }
    .header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .eyebrow { color: #211d19; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .message {
      background: #f3ede3;
      border: 1px solid #b8573c;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .message strong { color: #211d19; }
    .site-url {
      font-size: 12px;
      color: #6f6258;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .action-btn {
      display: block;
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #102c2c;
      color: #f4efde;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .action-btn:hover { background: #173f5f; }
    .action-btn:focus-visible { outline: 3px solid #3f8580; outline-offset: 2px; }
    .action-btn:disabled { background: #bbaa99; color: #6f6258; cursor: default; }
    .action-btn.secondary {
      background: transparent;
      color: #6f6258;
      font-weight: 500;
    }
    .action-btn.secondary:hover { background: #102c2c12; color: #211d19; }
    .success {
      background: #f3ede3;
      border: 1px solid #3f8580;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      line-height: 1.5;
      color: #211d19;
    }
    .separator {
      border-top: 1px solid #bbaa99;
      margin: 12px 0;
    }
    .supported {
      color: #6f6258;
      font-size: 12px;
      line-height: 1.6;
    }
    .supported strong { color: #211d19; font-weight: 500; }
    code {
      background: #102c2c;
      color: #f4efde;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 11px;
    }
    .hidden { display: none !important; }
    .route-line { height: 1px; margin: 0 0 16px; background: repeating-linear-gradient(90deg, #bd9348 0 5px, transparent 5px 10px); }
  </style>
</head>
<body>
  <div class="header">
    <img src="/assets/icons/icon48.png" alt="Logbook Waypoint">
    <div><div class="eyebrow">Chart the change</div><h1>Logbook Waypoint</h1></div>
  </div>
  <div class="route-line" aria-hidden="true"></div>
  <div class="message hidden" id="message"></div>
  <div class="success hidden" id="success"></div>
  <div class="site-url hidden" id="siteUrl"></div>
  <button class="action-btn hidden" id="mainBtn"></button>
  <button class="action-btn secondary hidden" id="allSitesBtn">Enable for all sites</button>
  <div class="separator"></div>
  <div class="supported">
    <strong>Auto-enabled:</strong><br>
    <code>localhost</code>
    <code>127.0.0.1</code>
    <code>0.0.0.0</code>
    <code>*.local</code>
    <code>*.test</code>
    <code>file://</code>
  </div>

  <script src="/popup-legacy.js"></script>
</body>
</html>
