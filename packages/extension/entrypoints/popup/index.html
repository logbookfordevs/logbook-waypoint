<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logbook Waypoint</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #17231f;
      background: #f7f0df;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header img { width: 32px; height: 32px; border-radius: 9px; }
    .header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .eyebrow { color: #a34b2a; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .update-banner {
      background: #eff6ff;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .update-banner strong { font-size: 12px; color: #1e40af; }
    .update-link {
      font-size: 12px;
      color: #3b82f6;
      text-decoration: none;
      white-space: nowrap;
      font-weight: 500;
    }
    .update-link:hover { text-decoration: underline; }
    .dismiss-btn {
      background: none;
      border: none;
      font-size: 16px;
      color: #6b7280;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .dismiss-btn:hover { color: #1f2937; }
    .message {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .message strong { color: #92400e; }
    .site-url {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .action-btn {
      display: block;
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #bd4d29;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .action-btn:hover { background: #963c22; }
    .action-btn:disabled { background: #d1d5db; cursor: default; }
    .action-btn.secondary {
      background: transparent;
      color: #6b7280;
      font-weight: 500;
    }
    .action-btn.secondary:hover { background: #f3f4f6; color: #374151; }
    .success {
      background: #d1fae5;
      border: 1px solid #10b981;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      line-height: 1.5;
      color: #065f46;
    }
    .separator {
      border-top: 1px solid #e5e7eb;
      margin: 12px 0;
    }
    .supported {
      color: #6b7280;
      font-size: 12px;
      line-height: 1.6;
    }
    .supported strong { color: #374151; font-weight: 500; }
    code {
      background: #f3f4f6;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 11px;
    }
    .hidden { display: none !important; }
    .route-line { height: 1px; margin: 0 0 16px; background: repeating-linear-gradient(90deg, #c99d55 0 5px, transparent 5px 10px); }
  </style>
</head>
<body>
  <div class="header">
    <img src="/assets/icons/icon48.png" alt="Logbook Waypoint">
    <div><div class="eyebrow">Chart the change</div><h1>Logbook Waypoint</h1></div>
  </div>
  <div class="route-line" aria-hidden="true"></div>
  <div class="update-banner hidden" id="updateBanner">
    <strong id="updateText"></strong>
    <div style="display:flex;align-items:center;gap:8px;">
      <a href="#" id="updateLink" class="update-link" target="_blank" rel="noopener">Learn more</a>
      <button id="updateDismiss" class="dismiss-btn" title="Dismiss">&times;</button>
    </div>
  </div>
  <div class="message hidden" id="message"></div>
  <div class="success hidden" id="success"></div>
  <div class="site-url hidden" id="siteUrl"></div>
  <button class="action-btn hidden" id="mainBtn"></button>
  <button class="action-btn secondary hidden" id="allSitesBtn">Enable for all sites</button>
  <div class="separator"></div>
  <div class="supported">
    <strong>Auto-enabled:</strong><br>
    <code>localhost</code>
    <code>127.0.0.1</code>
    <code>0.0.0.0</code>
    <code>*.local</code>
    <code>*.test</code>
    <code>file://</code>
  </div>

  <script src="/popup-legacy.js"></script>
</body>
</html>
