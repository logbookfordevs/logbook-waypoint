<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title description">
  <title id="title">Waypoint Ink Route preproduction storyboard</title>
  <desc id="description">Six frames show an immediate hero, tactile journey activation, empty Driftwood Paper, an ink impact, the first dashed route, and arrival at the Annotation destination.</desc>
  <defs>
    <pattern id="paper-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#735f49" stroke-opacity="0.055" stroke-width="1"/>
      <circle cx="7" cy="13" r="0.8" fill="#735f49" fill-opacity="0.1"/>
      <circle cx="38" cy="42" r="0.55" fill="#735f49" fill-opacity="0.08"/>
    </pattern>
    <filter id="paper-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#102c2c" flood-opacity="0.14"/>
    </filter>
    <clipPath id="thelu-one" clipPathUnits="userSpaceOnUse"><rect x="285" y="72" width="185" height="225" rx="14"/></clipPath>
    <clipPath id="thelu-two" clipPathUnits="userSpaceOnUse"><rect x="285" y="72" width="185" height="225" rx="14"/></clipPath>
    <style>
      .page-title { font: 650 36px Poppins, Avenir Next, sans-serif; fill: #17201e; letter-spacing: -1px; }
      .page-subtitle { font: 400 18px Literata, Georgia, serif; fill: #5f5549; }
      .shot-number { font: 700 13px 'IBM Plex Mono', monospace; fill: #c94f35; letter-spacing: 1.5px; }
      .shot-title { font: 650 24px Poppins, Avenir Next, sans-serif; fill: #17201e; }
      .shot-copy { font: 400 15px Literata, Georgia, serif; fill: #5f5549; }
      .working { font: 700 10px 'IBM Plex Mono', monospace; fill: #786b5c; letter-spacing: 1px; }
      .hero-heading { font: 650 26px Poppins, Avenir Next, sans-serif; fill: #102c2c; letter-spacing: -0.8px; }
      .hero-body { font: 400 13px Literata, Georgia, serif; fill: #3f3932; }
      .control { font: 650 12px Poppins, Avenir Next, sans-serif; }
      .mono { font: 600 10px 'IBM Plex Mono', monospace; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#f4f0e8"/>
  <text x="60" y="62" class="page-title">THE INK ROUTE · SIGNATURE SHOT</text>
  <text x="60" y="94" class="page-subtitle">Proposed preproduction coverage — treatment approved, tracer not yet greenlit</text>
  <path d="M60 116H1540" stroke="#bd9348" stroke-width="2" stroke-opacity="0.65"/>

  <!-- Shot 1 -->
  <g transform="translate(60 150)">
    <rect width="480" height="330" rx="18" fill="#e9e1d3" filter="url(#paper-shadow)"/>
    <rect width="480" height="330" rx="18" fill="url(#paper-grid)"/>
    <g transform="translate(28 26)">
      <rect width="34" height="34" rx="9" fill="#102c2c"/>
      <circle cx="17" cy="14" r="7" fill="#f3f0e7"/>
      <circle cx="17" cy="14" r="3" fill="#c94f35"/>
      <path d="M17 21L12 29H22Z" fill="#bd9348"/>
      <text x="46" y="15" class="control" fill="#17201e">Logbook</text>
      <text x="46" y="31" class="mono" fill="#c94f35">WAYPOINT</text>
    </g>
    <text x="28" y="102" class="working">WORKING COPY</text>
    <text x="28" y="136" class="hero-heading">MARK WHAT MATTERS.</text>
    <text x="28" y="165" class="hero-heading" fill="#c94f35">CHART THE CHANGE.</text>
    <text x="28" y="200" class="hero-body">Precise visual feedback.</text>
    <text x="28" y="220" class="hero-body">Trustworthy agent work.</text>
    <rect x="28" y="246" width="190" height="42" rx="8" fill="#102c2c"/>
    <text x="48" y="272" class="control" fill="#f3f0e7">GET WAYPOINT</text>
    <path d="M190 267h10m-4-5 5 5-5 5" fill="none" stroke="#bd9348" stroke-width="2"/>
    <text x="28" y="310" class="control" fill="#102c2c">SEE THE JOURNEY  →</text>
    <image href="../../../../packages/website/public/brand/thelu-profile.webp" x="285" y="72" width="185" height="225" preserveAspectRatio="xMidYMid slice" opacity="0.98" clip-path="url(#thelu-one)"/>
    <path d="M226 281C278 286 282 305 335 305" fill="none" stroke="#786b5c" stroke-width="2" stroke-dasharray="8 9" opacity="0.32"/>
  </g>
  <text x="60" y="520" class="shot-number">01 · PROMISE</text>
  <text x="60" y="551" class="shot-title">The useful hero waits.</text>
  <text x="60" y="577" class="shot-copy">Product access remains immediate; the film never blocks it.</text>

  <!-- Shot 2 -->
  <g transform="translate(560 150)">
    <rect width="480" height="330" rx="18" fill="#e9e1d3" filter="url(#paper-shadow)"/>
    <rect width="480" height="330" rx="18" fill="url(#paper-grid)"/>
    <g opacity="0.38">
      <rect x="28" y="26" width="34" height="34" rx="9" fill="#102c2c"/>
      <text x="74" y="48" class="control" fill="#17201e">Logbook Waypoint</text>
      <text x="28" y="128" class="hero-heading">MARK WHAT MATTERS.</text>
      <text x="28" y="158" class="hero-heading" fill="#c94f35">CHART THE CHANGE.</text>
      <text x="28" y="199" class="hero-body">Precise visual feedback.</text>
      <image href="../../../../packages/website/public/brand/thelu-profile.webp" x="285" y="72" width="185" height="225" preserveAspectRatio="xMidYMid slice" clip-path="url(#thelu-two)"/>
    </g>
    <g transform="translate(30 244) scale(0.97)">
      <rect width="196" height="46" rx="8" fill="#0d2424" stroke="#bd9348" stroke-width="2"/>
      <text x="19" y="29" class="control" fill="#f3f0e7">SEE THE JOURNEY</text>
      <path d="M164 23h14m-5-6 6 6-6 6" fill="none" stroke="#f3f0e7" stroke-width="2.5"/>
      <circle cx="180" cy="23" r="17" fill="none" stroke="#c94f35" stroke-width="2" opacity="0.7"/>
    </g>
    <path d="M228 268C284 276 304 301 350 308" fill="none" stroke="#17201e" stroke-width="2" stroke-dasharray="7 9" opacity="0.2"/>
  </g>
  <text x="560" y="520" class="shot-number">02 · GATE / CONTACT</text>
  <text x="560" y="551" class="shot-title">The visitor causes the edit.</text>
  <text x="560" y="577" class="shot-copy">Tactile press commits sound intent and the native-scroll journey.</text>

  <!-- Shot 3 -->
  <g transform="translate(1060 150)">
    <rect width="480" height="330" rx="18" fill="#e9e1d3" filter="url(#paper-shadow)"/>
    <rect width="480" height="330" rx="18" fill="url(#paper-grid)"/>
  </g>
  <text x="1060" y="520" class="shot-number">03 · ANTICIPATION</text>
  <text x="1060" y="551" class="shot-title">A truly empty paper hold.</text>
  <text x="1060" y="577" class="shot-copy">No UI, mascot, marker, or map—only Driftwood Paper and silence.</text>

  <!-- Shot 4 -->
  <g transform="translate(60 630)">
    <rect width="480" height="330" rx="18" fill="#e9e1d3" filter="url(#paper-shadow)"/>
    <rect width="480" height="330" rx="18" fill="url(#paper-grid)"/>
    <circle cx="192" cy="210" r="6" fill="#211b17"/>
    <path d="M192 210c-18-7-34 2-38 18 9 13 26 19 42 11 12 13 32 11 41-3 2-15-10-29-27-30-5-14-17-21-18-21-7 3-10 13-10 25Z" fill="#211b17" opacity="0.18"/>
    <path d="M192 210c-9 1-19 8-19 17 8 7 20 8 29 3 8 6 19 3 24-4-2-8-10-14-19-13-3-9-12-13-15-3Z" fill="#211b17" opacity="0.38"/>
    <path d="M196 216C216 226 225 242 234 260" fill="none" stroke="#211b17" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
    <path d="M140 178c12-12 28-17 43-14M244 196c16 2 27 10 36 21M155 253c-12 7-19 17-22 31" fill="none" stroke="#211b17" stroke-width="1.5" opacity="0.23"/>
    <g transform="translate(316 50)" opacity="0.6">
      <path d="M0 14h8m4 0h8m4 0h8" stroke="#17201e" stroke-width="2" stroke-linecap="round"/>
      <text x="42" y="19" class="mono" fill="#17201e">INK CONTACT</text>
    </g>
  </g>
  <text x="60" y="1000" class="shot-number">04 · IMPACT</text>
  <text x="60" y="1031" class="shot-title">Black ink finds the remembered origin.</text>
  <text x="60" y="1057" class="shot-copy">The first audible event is anchored to the first painted impact frame.</text>

  <!-- Shot 5 -->
  <g transform="translate(560 630)">
    <rect width="480" height="330" rx="18" fill="#e9e1d3" filter="url(#paper-shadow)"/>
    <rect width="480" height="330" rx="18" fill="url(#paper-grid)"/>
    <circle cx="120" cy="90" r="5" fill="#211b17"/>
    <path d="M120 90C137 132 105 153 138 182S224 190 232 237 310 284 386 255" fill="none" stroke="#211b17" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14"/>
    <path d="M98 130c34-22 67-18 93 1M251 80c45 18 72 48 87 91M318 270c39-12 73-6 102 10" fill="none" stroke="#735f49" stroke-width="1.5" opacity="0.18"/>
    <g transform="translate(340 54)">
      <path d="M0 12c4-10 8 10 12 0s8 10 12 0 8 10 12 0" fill="none" stroke="#3f8580" stroke-width="2"/>
      <text x="48" y="17" class="mono" fill="#3f8580">PAPER FIBER</text>
    </g>
    <circle cx="232" cy="237" r="13" fill="none" stroke="#bd9348" stroke-width="2" opacity="0.6"/>
  </g>
  <text x="560" y="1000" class="shot-number">05 · CONNECTION</text>
  <text x="560" y="1031" class="shot-title">The route becomes the traveling subject.</text>
  <text x="560" y="1057" class="shot-copy">Scroll velocity draws the dashes and modulates the paper-fiber scratch.</text>

  <!-- Shot 6 -->
  <g transform="translate(1060 630)">
    <rect width="480" height="330" rx="18" fill="#e9e1d3" filter="url(#paper-shadow)"/>
    <rect width="480" height="330" rx="18" fill="url(#paper-grid)"/>
    <path d="M30 70C110 56 145 100 155 157S230 230 298 192" fill="none" stroke="#211b17" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14"/>
    <circle cx="298" cy="192" r="34" fill="#e9e1d3" stroke="#c94f35" stroke-width="4"/>
    <circle cx="298" cy="192" r="23" fill="#c94f35" opacity="0.12"/>
    <path d="M286 192h24M298 180v24" stroke="#c94f35" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(48 191)">
      <rect width="178" height="94" rx="9" fill="#f3f0e7" stroke="#102c2c" stroke-width="2"/>
      <rect x="16" y="16" width="90" height="9" rx="4" fill="#102c2c" opacity="0.82"/>
      <rect x="16" y="36" width="130" height="7" rx="3" fill="#735f49" opacity="0.28"/>
      <rect x="16" y="52" width="112" height="7" rx="3" fill="#735f49" opacity="0.22"/>
      <rect x="16" y="71" width="72" height="9" rx="4" fill="#c94f35" opacity="0.75"/>
    </g>
    <text x="336" y="176" class="shot-number">ANNOTATION</text>
    <text x="336" y="199" class="hero-body">Target retained</text>
    <rect x="336" y="214" width="113" height="24" rx="5" fill="none" stroke="#735f49" stroke-width="1" opacity="0.65"/>
    <text x="347" y="230" class="mono" fill="#735f49">CONTEXT SAVED</text>
  </g>
  <text x="1060" y="1000" class="shot-number">06 · FIRST DESTINATION</text>
  <text x="1060" y="1031" class="shot-title">Annotation turns travel into product proof.</text>
  <text x="1060" y="1057" class="shot-copy">The tracer ends when the first checkpoint and retained context become legible.</text>
</svg>
