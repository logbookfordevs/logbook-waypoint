name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan repository and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned scanners
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/waypoint-security-tools"
          ./scripts/install-security-tools.sh "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Prove scanners reject unsafe fixtures
        run: ./scripts/verify-security-tools.sh

      - name: Scan Git history for secrets
        run: gitleaks git . --no-banner --redact

      - name: Validate GitHub Actions syntax
        run: actionlint

      - name: Audit GitHub Actions security
        run: zizmor --offline .
